<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover lets the layout run under the notch and home indicator;
      styles.css pays that back with env(safe-area-inset-*) padding.

      Pinch-zoom is deliberately left alone. This carried `maximum-scale=1.0,
      user-scalable=no` to stop a stray double-tap mid-ride, which iOS Safari
      has ignored since iOS 10 anyway — so all it actually did was stop an
      Android user from zooming in on a chart or a number they could not read.
      The problem it was really aimed at, iOS zooming the page when a field is
      focused, is already solved by the 16px minimum on inputs in styles.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a2b" />
    <!-- The unprefixed name is the standard; the apple- one is kept because
         older iOS versions still need it to launch without Safari chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ride Lab" />
    <meta name="description" content="Cycling case study: rides, RPE, heart rate, body composition, journal." />

    <!--
      Webfonts, loaded without blocking the first paint.

      These used to be an `@import` at the top of styles.css, which stalls the
      entire stylesheet on a cross-origin request. On a trail with no signal
      that meant a blank screen until the request gave up. Here the sheet is
      fetched as a non-blocking `print` stylesheet and promoted to `all` once it
      arrives, so the app paints immediately in its fallback faces and upgrades
      when — or if — the fonts turn up.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>Ride Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
