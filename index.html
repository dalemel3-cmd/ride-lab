<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover lets the layout run under the notch and home indicator;
      styles.css pays that back with env(safe-area-inset-*) padding.
      user-scalable=no stops a double-tap zoom mid-ride from wrecking the layout.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a2b" />
    <!-- The unprefixed name is the standard; the apple- one is kept because
         older iOS versions still need it to launch without Safari chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ride Lab" />
    <meta name="description" content="Cycling case study: rides, RPE, heart rate, body composition, journal." />
    <title>Ride Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
